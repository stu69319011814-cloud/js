<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Peer Chat & Share</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    
    .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 999; }
    .login-box { background: white; padding: 25px; border-radius: 12px; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 12px; text-align: center; }
    .login-box h3 { color: #007bff; margin-bottom: 5px; }
    .login-box input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
    .hint { font-size: 0.75rem; color: #666; text-align: left; }

    .chat-container { width: 100%; max-width: 600px; height: 90vh; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { background: #007bff; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
    .control-bar { display: flex; gap: 8px; padding: 10px; background: #e9ecef; border-bottom: 1px solid #ddd; align-items: center; }
    .control-bar input, .control-bar select, .control-bar span { padding: 6px; border-radius: 5px; font-size: 0.9rem; }
    .user-tag { font-weight: bold; color: #28a745; background: #e2f0d9; padding: 4px 8px; border-radius: 12px; }
    
    .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f8f9fa; }
    .message { max-width: 75%; padding: 10px 14px; border-radius: 15px; font-size: 0.95rem; word-wrap: break-word; }
    .message.mine { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .message.others { background: #e4e6eb; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
    .message .meta { font-size: 0.75rem; opacity: 0.8; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 10px; }
    .message a { color: inherit; font-weight: bold; text-decoration: underline; }

    .chat-input { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #ddd; align-items: center; }
    .chat-input input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    .btn { padding: 8px 16px; border: none; background: #007bff; color: white; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #0056b3; }
    .file-label { cursor: pointer; padding: 8px 12px; background: #6c757d; color: white; border-radius: 20px; font-size: 0.85rem; }
  </style>
  <!-- เรียกใช้ PeerJS Library สื่อสารแบบ P2P บน GitHub Pages -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<!-- หน้าต่างล็อกอิน -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h3>เข้าสู่ระบบแชท (GitHub Pages)</h3>
    <input type="text" id="nicknameInput" placeholder="ตั้งชื่อเล่นของคุณ (เช่น Benz)..." required>
    <span class="hint">*รันได้ทันที ไม่ต้องใส่ IP และไม่ต้องรัน server.js</span>
    <button class="btn" onclick="initPeer()">เข้าสู่ห้องแชท</button>
  </div>
</div>

<div class="chat-container">
  <div class="chat-header">Classroom P2P Chat & File Transfer</div>
  
  <div class="control-bar">
    <span>ผู้ใช้: <span class="user-tag" id="myNickname">-</span></span>
    <select id="chatMode" onchange="togglePrivateInput()">
      <option value="group">แชทกลุ่ม (ส่งหาทุกคนที่เชื่อมต่อ)</option>
      <option value="private">แชทเดี่ยว</option>
    </select>
    <input type="text" id="targetPeerInput" placeholder="ใส่ชื่อเล่นเพื่อน..." style="display: none; width: 140px;">
  </div>

  <div class="chat-messages" id="chatBox"></div>

  <div class="chat-input">
    <label for="fileInput" class="file-label">📎 ไฟล์</label>
    <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect()">
    <input type="text" id="messageInput" placeholder="พิมพ์ข้อความที่นี่..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="btn" onclick="sendMessage()">ส่ง</button>
  </div>
</div>

<script>
  let peer = null;
  let myName = '';
  let connections = {}; // เก็บการเชื่อมต่อกับเพื่อนๆ
  let selectedFile = null;

  function initPeer() {
    myName = document.getElementById('nicknameInput').value.trim();
    if (!myName) return alert('กรุณาระบุชื่อเล่น');

    // สร้าง ID ของตัวเองจากชื่อเล่น (แปลงเป็นภาษาอังกฤษ/ตัวเลข ป้องกันบั๊ก)
    const peerId = 'classroom-user-' + encodeURIComponent(myName);

    // เชื่อมต่อกับ PeerServer กลางของระบบ WebRTC
    peer = new Peer(peerId);

    peer.on('open', (id) => {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('myNickname').textContent = myName;
      alert(`เข้าสู่ระบบสำเร็จ! ชื่อของคุณคือ: ${myName}`);
    });

    // รับการเชื่อมต่อจากคนอื่น
    peer.on('connection', (conn) => {
      setupConnection(conn);
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        alert('ชื่อเล่นนี้มีคนใช้แล้ว กรุณาเปลี่ยนชื่อเล่นใหม่');
      } else {
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err.type);
      }
    });
  }

  function setupConnection(conn) {
    conn.on('open', () => {
      connections[conn.peer] = conn;
    });

    // รับข้อมูลข้อความ หรือ ไฟล์
    conn.on('data', (data) => {
      renderMessage(data, false);
    });

    conn.on('close', () => {
      delete connections[conn.peer];
    });
  }

  function togglePrivateInput() {
    const mode = document.getElementById('chatMode').value;
    document.getElementById('targetPeerInput').style.display = mode === 'private' ? 'inline-block' : 'none';
  }

  function handleFileSelect() {
    const file = document.getElementById('fileInput').files[0];
    if (file) {
      selectedFile = file;
      alert(`เลือกไฟล์: ${file.name} แล้ว (พร้อมส่ง)`);
    }
  }

  async function sendMessage() {
    const msgText = document.getElementById('messageInput').value.trim();
    const mode = document.getElementById('chatMode').value;
    const targetName = document.getElementById('targetPeerInput').value.trim();

    if (!msgText && !selectedFile) return;

    let filePayload = null;
    if (selectedFile) {
      const buffer = await selectedFile.arrayBuffer();
      filePayload = {
        name: selectedFile.name,
        type: selectedFile.type,
        fileData: buffer
      };
    }

    const payload = {
      sender: myName,
      text: msgText,
      file: filePayload,
      type: mode,
      target: targetName,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    };

    if (mode === 'private') {
      if (!targetName) return alert('กรุณาพิมพ์ชื่อเล่นของผู้รับ');
      const targetPeerId = 'classroom-user-' + encodeURIComponent(targetName);
      
      // ถ้ายังไม่เคยต่อกับเพื่อนคนนี้ ให้ทักไปต่อก่อน
      if (!connections[targetPeerId]) {
        const conn = peer.connect(targetPeerId);
        setupConnection(conn);
        conn.on('open', () => {
          conn.send(payload);
          renderMessage(payload, true);
        });
      } else {
        connections[targetPeerId].send(payload);
        renderMessage(payload, true);
      }
    } else {
      // แชทกลุ่ม: ส่งกระจายหาทุกคนที่เคยเชื่อมต่ออยู่
      Object.values(connections).forEach(conn => {
        if (conn.open) conn.send(payload);
      });
      renderMessage(payload, true);
    }

    document.getElementById('messageInput').value = '';
    document.getElementById('fileInput').value = '';
    selectedFile = null;
  }

  function renderMessage(data, isMine) {
    const chatBox = document.getElementById('chatBox');
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', isMine ? 'mine' : 'others');

    let modeBadge = data.type === 'private' ? `🔒 [ส่วนตัว]` : '👥 [กลุ่ม]';
    let contentHtml = `<div class="meta"><span>${data.sender} ${modeBadge}</span><span>${data.time}</span></div>`;
    
    if (data.text) contentHtml += `<div>${data.text}</div>`;
    
    // ถ้ามีไฟล์ แนบลิงก์สำหรับดาวน์โหลด
    if (data.file) {
      const blob = new Blob([data.file.fileData], { type: data.file.type });
      const fileUrl = URL.createObjectURL(blob);
      contentHtml += `<div style="margin-top: 5px;">
        📁 <a href="${fileUrl}" download="${data.file.name}" target="_blank">${data.file.name}</a>
      </div>`;
    }

    msgDiv.innerHTML = contentHtml;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>

</body>
</html>
